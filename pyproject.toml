[build-system]
requires = ["hatchling>=1.26,<2"]
build-backend = "hatchling.build"

[project]
name = "agent-memory-geometry"
version = "0.1.0"
description = "Analysis code for The Geometry of Agent Memory"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = ["numpy==2.4.2", "scipy==1.17.1", "scikit-learn==1.8.0", "matplotlib==3.10.8"]

[project.scripts]
memory-geometry-features = "agent_memory_geometry.features:main"
memory-geometry-evaluate = "agent_memory_geometry.evaluation:main"
memory-geometry-reproduce = "agent_memory_geometry.reproduce:main"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_memory_geometry"]

[tool.hatch.build.targets.sdist]
include = ["src", "data", "docs", "tests", "tools", "README.md", "CITATION.cff", "NOTICE.md", "pyproject.toml", "uv.lock"]
